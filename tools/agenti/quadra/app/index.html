<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadra — Fatture fornitori</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.svg" alt="" width="30" height="30"><b>Quadra</b></div>
  <nav class="tabs" aria-label="Sezioni"><span class="on">Fatture passive</span><span>Scadenzario</span><span>Fornitori</span></nav>
  <div class="top-r">
    <span class="org" id="azienda">Lariana Componenti S.r.l.</span>
    <span class="mode" id="mode" hidden>Dati dimostrativi</span>
    <button class="run" id="run" type="button">Controlla le fatture</button>
  </div>
</header>

<main class="grid">
  <section class="left">
    <div class="panel inbox">
      <header class="ph"><h2>Fatture in arrivo dallo SDI</h2><span class="tot" id="tot"></span></header>
      <table class="inv" id="inv">
        <thead><tr><th>Fornitore</th><th>Numero</th><th>Data</th><th class="n">Totale</th><th>Stato</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel detail" id="detail">
      <div class="placeholder" id="placeholder">Il controllo a tre vie di ogni fattura comparirà qui: ordine, merce consegnata e fattura a confronto.</div>
    </div>
  </section>

  <aside class="log">
    <h2>Giornale dell'agente</h2>
    <div class="feed" id="feed"></div>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
